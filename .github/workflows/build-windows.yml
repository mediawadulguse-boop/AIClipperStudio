name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
          choco install innosetup --yes --no-progress

      - name: Validate Python source
        shell: pwsh
        run: |
          python -m compileall app.py ai_clipper tests
          python -m unittest discover -s tests -v

      - name: Prepare bundled engines
        shell: pwsh
        run: |
          python prepare_release_engines.py

      - name: Build application
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm AIClipperStudio.spec

          $exe = ".\dist\AIClipperStudio\AIClipperStudio.exe"
          if (-not (Test-Path $exe)) {
            throw "AIClipperStudio.exe tidak terbentuk"
          }

          if ((Get-Item $exe).Length -lt 100000) {
            throw "AIClipperStudio.exe tidak valid"
          }

      - name: Build installer
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null

          $isccCandidates = @(
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )

          $iscc = $isccCandidates |
            Where-Object { $_ -and (Test-Path $_) } |
            Select-Object -First 1

          if (-not $iscc) {
            throw "Inno Setup ISCC.exe tidak ditemukan"
          }

          & $iscc "installer\AIClipperStudio.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Gagal membuat installer"
          }

          $installer = Get-ChildItem ".\release\AIClipperStudio_Setup_*.exe" |
            Select-Object -First 1

          if (-not $installer) {
            throw "Installer EXE tidak ditemukan"
          }

      - name: Generate SHA256
        shell: pwsh
        run: |
          $installer = Get-ChildItem ".\release\AIClipperStudio_Setup_*.exe" |
            Select-Object -First 1

          $hash = (Get-FileHash $installer.FullName -Algorithm SHA256).Hash
          "$($installer.Name) SHA256=$hash" |
            Set-Content ".\release\SHA256.txt"

          Write-Host "Installer:" $installer.FullName
          Write-Host "SHA256:" $hash

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AIClipperStudio-Windows-Installer
          path: |
            release/AIClipperStudio_Setup_*.exe
            release/SHA256.txt
          if-no-files-found: error
